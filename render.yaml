services:
  - type: web
    runtime: node
    name: codexia-app
    plan: free
    buildCommand: npm ci --prefix Backend && npm ci --prefix Frontend --include=dev && npm --prefix Frontend run build
    startCommand: npm --prefix Backend run migrate && npm --prefix Backend start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PILOTO_ACTIVO
        value: "false"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: VITE_EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: codexia-db
          property: connectionString
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RATE_LIMIT_SECRET
        generateValue: true

databases:
  - name: codexia-db
    plan: free
    databaseName: codexia
    user: codexia
