services:
  - type: web
    runtime: node
    name: codexia-app
    plan: free
    buildCommand: npm ci --prefix Backend && npm ci --prefix Frontend && npm --prefix Frontend run build
    startCommand: npm --prefix Backend run migrate && npm --prefix Backend start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PILOTO_ACTIVO
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: codexia-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: RATE_LIMIT_SECRET
        generateValue: true

databases:
  - name: codexia-db
    plan: free
    databaseName: codexia
    user: codexia
